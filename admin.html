<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-bar { padding: 10px; width: 300px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-export { background: #10b981; color: white; }
        .btn-export:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #334155; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 5px; }
        .del-btn:hover { background: #dc2626; }
        .view-btn { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .view-btn:hover { background: #2563eb; }
        .stats { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        
        /* Modal Styles */
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; }
        .modal { background: #1e293b; padding: 20px; border-radius: 8px; width: 600px; max-width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid #334155; }
        .modal h2 { margin-top: 0; color: #f8fafc; }
        .modal-close { background: #475569; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; float: right; }
        pre { background: #0f172a; padding: 15px; border-radius: 4px; overflow-x: auto; font-size: 13px; color: #10b981; }
    </style>
    <script src="lib/firebase-app-compat.js"></script>
    <script src="lib/firebase-auth-compat.js"></script>
    <script src="lib/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="storage.js" type="module"></script>
    <script src="admin.js" type="module"></script>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>👑 Admin Dashboard</h1>
            <div id="loadingIndicator" style="display:none; color:#fbbf24;">Loading...</div>
        </div>
        
        <div class="header-actions">
            <div>
                <input type="text" id="searchInput" class="search-bar" placeholder="Search by name, ID, or passport...">
            </div>
            <div>
                <button id="exportCsvBtn" class="btn btn-export">Export to CSV</button>
            </div>
        </div>
        
        <div class="stats" id="statsDisplay">Total Profiles: 0</div>
        
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Passport / NID</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="5">Checking authentication...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-backdrop">
        <div class="modal">
            <button class="modal-close" id="closeModalBtn">Close</button>
            <h2 id="modalTitle">Profile Details</h2>
            <pre id="modalContent"></pre>
        </div>
    </div>
</body>
</html>

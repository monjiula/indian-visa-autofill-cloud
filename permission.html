<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Required - Indian Visa Autofill Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            padding: 32px 28px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo {
            width: 48px;
            height: 48px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .shield-icon {
            width: 56px;
            height: 56px;
            background: #e0e7ff;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .portal-name {
            color: #4f46e5;
            font-weight: 700;
        }

        p {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-allow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }

        .btn-allow:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.45);
        }

        .btn-allow:active {
            transform: translateY(0);
        }

        .notice {
            margin-top: 18px;
            font-size: 11.5px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="icons/icon48.png" alt="Logo" class="logo">
            <span class="brand-name">Indian Visa Autofill Pro</span>
        </div>

        <div class="shield-icon">🔐</div>

        <h2>One-Time Permission Request</h2>
        <p>To enable the autofill assistant on <span id="portalNameDisplay" class="portal-name">External Portal</span>, Chrome requires your one-time permission.</p>

        <button id="allowBtn" class="btn-allow">
            <span>Allow Access & Open Portal</span>
            <span>➔</span>
        </button>

        <div class="notice">
            🔒 Safe & Secure. This permission is only used to assist you with autofilling application forms.
        </div>
    </div>

    <script src="permission.js"></script>
</body>
</html>
